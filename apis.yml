aid: twine-ventures
name: Twine Ventures
description: 'Twine Ventures is an early-stage venture capital firm "transforming human
  and planetary health," writing first checks into interdisciplinary, data-obsessed
  founders who use data and AI to transform legacy industries across healthcare,
  industrials, and fintech/data. It was founded by Leshika Samarasinghe — early Google
  product team, founding member of ARPA-E, and former Managing Partner at The Production
  Board — who raised a $25M debut fund in 2022 (WSJ); Ethan Yeh, PhD, former Head of
  Data Science at Stripe, joined as Managing Partner. Its ~33-company portfolio includes
  Apella, Alaffia, Rupa Health (acq), Waltz Health (acq), Waymark, Teiko Bio, CloudCruise,
  and Rowspace. Surfaced as a Foundry Group partner-fund lead in the API Evangelist
  network; the firm runs a Webflow marketing site and publishes no public API, developer
  portal, or machine-readable surface.'
